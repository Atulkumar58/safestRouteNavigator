apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saferoute
  namespace: saferoute
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: saferoute-backend
                port:
                  name: http