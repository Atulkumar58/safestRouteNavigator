apiVersion: v1
kind: Secret
metadata:
  name: saferoute-secrets
  namespace: saferoute
type: Opaque
stringData:
  # Replace every placeholder before applying. Never commit the populated file.
  MONGODB_URI: "REPLACE_WITH_MONGODB_URI"
  OPENAQ_API_KEY: "REPLACE_WITH_OPENAQ_API_KEY"
  API_BEARER_TOKEN: "REPLACE_WITH_AT_LEAST_32_CHAR_RANDOM_TOKEN"
  # Used only if Pipeline B is configured to call a weather provider directly.
  WEATHER_API_KEY: ""
