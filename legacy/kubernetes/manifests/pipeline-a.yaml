apiVersion: apps/v1
kind: Deployment
metadata:
  name: saferoute-pipeline-a
  namespace: saferoute
spec:
  # One worker and one warm standby. Both contend for the renewable MongoDB lease.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: saferoute-pipeline-a
  template:
    metadata:
      labels:
        app: saferoute-pipeline-a
    spec:
      terminationGracePeriodSeconds: 900
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: saferoute-pipeline-a
      containers:
        - name: pipeline-a
          image: saferoute-pipeline-a:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: saferoute-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: saferoute-secrets
                  key: MONGODB_URI
            - name: OPENAQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: saferoute-secrets
                  key: OPENAQ_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saferoute-pipeline-a
  namespace: saferoute
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: saferoute-pipeline-a
