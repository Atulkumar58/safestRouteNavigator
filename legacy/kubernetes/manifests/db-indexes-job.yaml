apiVersion: batch/v1
kind: Job
metadata:
  name: saferoute-db-indexes
  namespace: saferoute
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: ensure-indexes
          image: saferoute-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/ensure-mongodb-indexes.js"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: saferoute-secrets
                  key: MONGODB_URI
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
