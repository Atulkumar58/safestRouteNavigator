apiVersion: v1
kind: ConfigMap
metadata:
  name: saferoute-config
  namespace: saferoute
data:
  PORT: "3000"
  ROUTING_PROVIDER: "valhalla"
  MAX_CONCURRENT_ROUTE_REQUESTS: "20"
  POLLUTION_LOOKUP_CONCURRENCY: "30"
  MIN_EXPOSURE_CONFIDENCE: "0.5"
  MAX_ROUTE_POLLUTION_SAMPLES: "20"
  MONGODB_MAX_POOL_SIZE: "30"
  ESTIMATE_SEARCH_METERS: "150"
  ESTIMATE_MAX_AGE_MINUTES: "30"
  OBSERVATION_MAX_AGE_HOURS: "24"
  WEATHER_SEARCH_METERS: "50000"
  WEATHER_MAX_AGE_HOURS: "3"
  ROUTE_DATA_RETENTION_DAYS: "30"
  IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS: "180"
  PIPELINE_SENSOR_CACHE_PATH: "/tmp/sensor_metadata.json"
  WEATHER_API_URL: ""
  PIPELINE_INTERVAL_SECONDS: "600"
  PIPELINE_LOCK_POLL_SECONDS: "15"
  PIPELINE_LOCK_LEASE_SECONDS: "120"
  MAX_ESTIMATION_OBSERVATIONS: "20000"
  PIPELINE_HEALTH_PORT: "8081"
