apiVersion: apps/v1
kind: Deployment
metadata:
  name: saferoute-backend
  namespace: saferoute
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A single EC2 node should not need memory for a third backend pod
      # during a rollout. Permit one temporarily unavailable replica instead.
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: saferoute-backend
  template:
    metadata:
      labels:
        app: saferoute-backend
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: saferoute-backend
      containers:
        - name: backend
          image: saferoute-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: saferoute-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: saferoute-secrets
                  key: MONGODB_URI
            - name: API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: saferoute-secrets
                  key: API_BEARER_TOKEN
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: saferoute-secrets
                  key: WEATHER_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: saferoute-backend
  namespace: saferoute
spec:
  type: ClusterIP
  selector:
    app: saferoute-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saferoute-backend
  namespace: saferoute
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: saferoute-backend
